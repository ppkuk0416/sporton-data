<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SPORTON · 데이터 관리</title>
<style>body{background:#0a0e17;color:#ecf2fc;font:15px/1.6 system-ui;margin:0}main{max-width:1200px;margin:auto;padding:35px}section{padding:22px;background:#111827;border:1px solid #253147;border-radius:12px;margin:20px 0}input,button,select{padding:10px;background:#162334;border:1px solid #4a5f76;color:white;border-radius:7px}h1{color:#75e2bc}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:600px;overflow:auto}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:8px;border-bottom:1px solid #334155}.warning{color:#ffb9b9}.ok{color:#75e2bc}</style>
<main><h1>SPORTON · 데이터 보존 관리</h1><p>원본·정정·검증·백업과 실제 복원 상태를 추적합니다. 백업 파일 생성은 복원 검증 완료가 아닙니다.</p>
<section><label>관리자 토큰 <input type="password" id="token" autocomplete="off"></label> <button id="connect">조회</button><p id="status">조회 권한이 필요합니다. 토큰은 이 화면 메모리에서만 사용합니다.</p></section>
<section><h2>보관 현황</h2><div id="counts"></div></section><section><h2>백업 · 실제 복원 검증</h2><p id="backupstate"></p><pre id="backup"></pre></section>
<section><h2>보고서 원본 추적</h2><select id="reports"></select> <button id="open">원본·근거·시장·심사·결과</button><pre id="trace"></pre></section>
<section><h2>누락 · 충돌 · 정정</h2><pre id="issues"></pre></section><section><h2>검증된 원본 기반 성능</h2><pre id="performance"></pre></section><section><h2>모델 · 학습 · 수집 오류</h2><pre id="models"></pre></section></main>
<script>
let token='';const $=id=>document.getElementById(id);async function get(path){const r=await fetch(path,{headers:{Authorization:'Bearer '+token}});if(!r.ok)throw Error('HTTP '+r.status);return r.json()}function json(id,p){$(id).textContent=JSON.stringify(p,null,2)}
$('connect').onclick=async()=>{token=$('token').value;$('token').value='';try{const s=await get('/api/admin/status');$('status').textContent='연결됨 · '+s.database_engine;const t=document.createElement('table');for(const [name,n] of Object.entries(s.counts)){const tr=document.createElement('tr');for(const v of [name,n]){const td=document.createElement('td');td.textContent=v;tr.append(td)}t.append(tr)}$('counts').replaceChildren(t);const b=s.backup;$('backupstate').textContent=b.latest_backup_restore_verified?'최신 백업: 실제 복원 및 해시 검증 완료':'최신 백업: 복원 검증 미완료 / 구성 확인 필요';$('backupstate').className=b.latest_backup_restore_verified?'ok':'warning';json('backup',{...b,wal_archiver:s.wal_archiver});json('issues',{issues:s.data_issues,corrections:s.corrections});json('performance',s.performance);json('models',{versions:s.model_versions,training:s.training_runs,source_errors:s.source_errors});$('reports').replaceChildren();for(const r of s.reports){const o=document.createElement('option');o.value=r.id;o.textContent=r.kind+' · '+r.created_at+' · '+r.data_mode;$('reports').append(o)}}catch(e){$('status').textContent=e.message;token=''}};
$('open').onclick=async()=>{try{json('trace',await get('/api/admin/reports/'+encodeURIComponent($('reports').value)))}catch(e){$('trace').textContent=e.message}};
</script></html>
